<!--
  아임웹 /event 페이지의 "코드" 요소에 이 파일 내용을 전부 그대로 붙여넣는다.
  Firebase 프로젝트: jajucenter-4ce99
-->
<iframe id="jc-contest-frame"
        src="https://jajucenter-4ce99.web.app/apply"
        title="2026 자기주도학습센터 활용수기 공모 접수"
        style="display:block;width:100%;max-width:760px;margin:0 auto;height:2600px;border:0;"
        scrolling="no"></iframe>
<script>
  // 접수 화면이 알려주는 높이에 맞춰 iframe 높이를 조절하고, 오류·완료 시 해당 위치로 스크롤한다.
  // 이 스크립트가 실행되지 않는 경우에도 위 height(2600px)로 접수는 가능하다.
  (function () {
    var ORIGIN = 'https://jajucenter-4ce99.web.app';
    var frame = document.getElementById('jc-contest-frame');
    window.addEventListener('message', function (e) {
      if (e.origin !== ORIGIN || !e.data) return;
      if (e.data.type === 'jc-contest-height' && e.data.height > 0) {
        frame.style.height = e.data.height + 'px';
      }
      if (e.data.type === 'jc-contest-scroll') {
        var top = frame.getBoundingClientRect().top + window.pageYOffset + (e.data.y || 0) - 80;
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
    });
  })();
</script>
